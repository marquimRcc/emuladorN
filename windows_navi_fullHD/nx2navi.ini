# NX2navi v0.10.1 - Perfil Otimizado FullHD 1080p @ 30 FPS Travado
# Resolução: 1920x1080 (Janela) • Alvo: 30 FPS Rochosos (33.33 ms)
# GPU: AMD Radeon RX 6750 XT (RDNA2) • CPU: Intel Core i5-12400F

[display]
window_size = 1920x1080
output_res = 1920x1080
game_res = 1080
game_aspect = 16:9
fullscreen = 0
assume_focus = 1
perf_overlay = full
upscaler = fsr
sharpness = 80
standin_filter = easu
aa = fxaa
dlaa = 0
framegen = off
vk_present = fifo
texture_detail = full
shadow_res = 1024
aniso = 16

[frame rate]
fps_limit = 30
realtime = 1
fps60 = 0
highfps_fix = 1
step_steady = 1
rtss = 0

[performance]
# ASTC sem compressao BC3/BC1 para eliminar blocos cianos nos esporos e nevoa de Kokiri
astc = auto
astc_bc = 0
astc_bc1 = 0

# Desativado replay_async para eliminar piscadas pretas (black flickering)
replay_async = 0
replay_workers = 0

# Otimizacoes de memoria virtual e estabilidade Vulkan no RDNA2
heap_lazy = 1
tex_compact = 1
tex_released_max = 2048
tex_clobber = 1
split_idle = 0
low_end_gpu = 0
zstd_native = 1
pipeline_cache = 1
cores = 10

[controls]
pad_layout = xbox
prompts = xbox
rumble = 1

[locale]
lang = pt-BR
locale = pt_BR
