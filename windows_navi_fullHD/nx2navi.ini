# NX2navi v0.10.1 - Configuração FullHD 1080p Travado a 30 FPS
# Resolução: 1920x1080 (Janela FullHD) • Limite: 30 FPS Cravados
# Hardware: Intel Core i5-12400F • AMD Radeon RX 6750 XT (12 GB VRAM)

[display]
window_size = 1920x1080
output_res = 1920x1080
game_res = 1080
render_scale = 100
game_aspect = 16:9
fullscreen = 0
assume_focus = 1
perf_overlay = full
upscaler = fsr
sharpness = 80
standin_filter = easu
taa = fsr3
aa = fxaa
dlaa = 0
framegen = off
vk_present = fifo
texture_detail = high
shadow_res = 2048
aniso = 16

[frame rate]
fps_limit = 30
realtime = 1
fps60 = 0
highfps_fix = 1

[performance]
low_end_gpu = 1
replay_async = 1
zstd_native = 1
pipeline_cache = 1
tex_compact = 1
tex_released_max = 2048
cores = 10

[controls]
pad_layout = xbox
prompts = xbox
rumble = 1

[locale]
lang = pt-BR
locale = pt_BR
