# Longshot - The Legend of Zelda: Ocarina of Time (Nintendo Switch 2 Remake -> PC Nativo)
# Configuração baseada nas recomendações e commits do repositório https://github.com/marquimRcc/emuladorN
# Hardware Alvo: AMD Radeon RX 6750 XT (12 GB VRAM) • Intel Core i5-12400F (6C/12T) • Windows 11

[display]
output_res=1920x1080
resolution=1
fullscreen=0
ultrawide=0
handheld_profile=0

[graphics]
preset=4
vram_budget=4
upscaling=0
dlss=3
sharpness=80
frame_generation=0
frame_pacing=1
vsync=1
antilag=1
anisotropy=4
astc_rgba8=0

[performance]
frame_rate_cap=0
realtime=1
compile_shaders=0

[gameplay]
show_fps=1
fps_corner=0
skip_opening=0
game_lang=8
menu_lang=8

[controls]
pad_layout=1
prompts=1
rumble=1
controller_in_background=1
mouse_camera=0
